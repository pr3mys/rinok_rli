{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<style>
    .auth-page {
        max-width: 440px;
        margin: 48px auto;
    }

    .auth-card {
        padding: 36px !important;
        border: 1px solid #e2e8f0;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 12px 40px rgba(71, 84, 105, 0.08);
    }

    .auth-heading {
        color: #475569;
        font-size: 1.9rem;
        font-weight: 750;
        letter-spacing: -0.8px;
    }

    .auth-subtitle {
        color: #64748b;
        font-size: 0.95rem;
    }

    .auth-card .form-label {
        color: #475569;
        font-size: 0.92rem;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .auth-card .form-control {
        min-height: 48px;
        border: 1px solid #dbe2ea;
        border-radius: 12px;
        background: #f9fafc;
        color: #475569;
        padding: 12px 14px;
    }

    .auth-card .form-control::placeholder {
        color: #9aa6b5;
    }

    .auth-card .form-control:focus {
        background: #fff;
        border-color: #4784be;
        box-shadow: 0 0 0 3px rgba(71, 132, 190, 0.13);
    }

    .auth-submit {
        min-height: 48px;
        border-radius: 12px;
        background: #4784be;
        border: 1px solid #4784be;
        color: #fff;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .auth-submit:hover {
        background: #3d73a8;
        border-color: #3d73a8;
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 5px 14px rgba(71, 132, 190, 0.18);
    }

    .auth-link {
        color: #4784be;
        font-weight: 600;
        text-decoration: none;
    }

    .auth-link:hover {
        color: #3d73a8;
        text-decoration: underline;
    }

    .auth-footer {
        color: #64748b;
        font-size: 0.94rem;
    }

    @media (max-width: 480px) {
        .auth-page {
            margin: 20px auto;
        }

        .auth-card {
            padding: 26px !important;
        }
    }
</style>

<div class="auth-page">
    <div class="card auth-card">
        <div class="text-center mb-4">
            <h2 class="auth-heading mb-2">С возвращением!</h2>
            <p class="auth-subtitle mb-0">Войди в свой аккаунт на Рынке РЛИ</p>
        </div>

        {% if error %}
            <div class="alert alert-danger rounded-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input
                    type="text"
                    class="form-control"
                    name="username"
                    required
                    placeholder="Введите логин"
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Пароль</label>
                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                    placeholder="Введите пароль"
                >
            </div>

            <button type="submit" class="btn auth-submit w-100">
                Войти
            </button>
        </form>

        <div class="text-center mt-4 auth-footer">
            Нет аккаунта?
            <a class="auth-link" href="{{ url_for('register') }}">
                Зарегистрироваться
            </a>
        </div>
    </div>
</div>
{% endblock %}
