{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="text-center mb-4">Регистрация</h2>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST" id="registerForm"
                  onsubmit="return confirm('Аккаунт должен быть верифицирован в течение ближайших дней. По вопросам верификации обращайтесь к администраторам: {{ ADMIN_PHONES_STR }}. Запрещено указывать левые данные. Продолжить регистрацию?');">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" class="form-control" name="username" id="username" required placeholder="Минимум 5 символов">
                    <div class="text-danger small" id="usernameError" style="display:none;">Не менее 5 символов</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" name="password1" id="password1" required placeholder="Минимум 6 символов">
                    <div class="text-danger small" id="password1Error" style="display:none;">Не менее 6 символов</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-control" name="password2" id="password2" required placeholder="Повторите пароль">
                    <div class="text-danger small" id="password2Error" style="display:none;">Пароли не совпадают</div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control" name="first_name" id="first_name" required placeholder="Иван">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" class="form-control" name="last_name" id="last_name" required placeholder="Иванов">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Класс</label>
                        <input type="text" class="form-control" name="class_name" placeholder="10А">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="tel" class="form-control" name="phone_number" id="phone_number" required placeholder="+7XXXXXXXXXX">
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 mt-2" id="submitBtn" disabled>Зарегистрироваться</button>
            </form>
            <div class="text-center mt-3">
                <span>Уже есть аккаунт?</span>
                <a href="{{ url_for('login') }}">Войти</a>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    var btn = document.getElementById("submitBtn");
    var u = document.getElementById("username");
    var p1 = document.getElementById("password1");
    var p2 = document.getElementById("password2");
    var fn = document.getElementById("first_name");
    var ln = document.getElementById("last_name");
    var ph = document.getElementById("phone_number");

    function toggle(id, show) {
        document.getElementById(id).style.display = show ? "block" : "none";
    }

    function check() {
        var ok = true;
        if (u.value.trim().length < 5) { toggle("usernameError", true); ok = false; } else toggle("usernameError", false);
        if (p1.value.length < 6) { toggle("password1Error", true); ok = false; } else toggle("password1Error", false);
        if (p1.value !== p2.value) { toggle("password2Error", true); ok = false; } else toggle("password2Error", false);
        if (!fn.value.trim()) ok = false;
        if (!ln.value.trim()) ok = false;
        if (!ph.value.trim()) ok = false;
        btn.disabled = !ok;
    }

    [u, p1, p2, fn, ln, ph].forEach(function(el) { el.addEventListener("input", check); });
    check();
})();
</script>
{% endblock %}
